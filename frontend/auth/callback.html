<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in… — MNEMIX</title>

  <!-- Supabase config — replace with your project values -->
  <!-- Styles -->
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">

  <!-- CDN scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- App scripts -->
  <script src="/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>

  <style>
    .callback-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      text-align: center;
      padding: var(--space-8);
    }
    .callback-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: var(--space-8);
    }
  </style>
</head>
<body>

<div class="callback-wrap" id="status">
  <div class="callback-logo">
    <div class="sidebar-logo-mark" style="width:32px;height:32px;font-size:14px;">M</div>
    <span class="sidebar-logo-text text-lg">MNEMIX</span>
  </div>
  <div class="spinner spinner-lg"></div>
  <p class="text-secondary" id="status-text">Signing you in…</p>
</div>

<div id="toast-container" class="toast-container"></div>

<script>
  async function handleCallback() {
    const statusEl = document.getElementById('status-text');

    try {
      const session = await Auth.handleCallback();

      if (!session) {
        statusEl.textContent = 'No session found. Redirecting to login…';
        setTimeout(() => { window.location.href = '/login.html'; }, 2000);
        return;
      }

      statusEl.textContent = 'Signed in! Redirecting…';

      // Fast path: if this device has already completed onboarding, go straight to dashboard
      if (localStorage.getItem('mnemix_onboarded') === 'true') {
        window.location.href = '/dashboard.html';
        return;
      }

      // Slow path: check profile + memory count to detect returning users
      try {
        const headers = { 'Authorization': `Bearer ${session.access_token}` };
        const [profileResp, memResp] = await Promise.all([
          fetch('/api/v1/profile', { headers }),
          fetch('/api/v1/memory/profile', { headers }),
        ]);
        const profileData = await profileResp.json();
        const memData = await memResp.json();
        // Consider onboarded if profile was saved OR any memories exist
        const onboarded = (profileResp.ok && profileData.last_updated) || (memResp.ok && memData.total_memories > 0);
        if (onboarded) {
          localStorage.setItem('mnemix_onboarded', 'true');
          window.location.href = '/dashboard.html';
        } else {
          window.location.href = '/onboarding.html';
        }
      } catch {
        window.location.href = '/onboarding.html';
      }

    } catch (err) {
      statusEl.textContent = 'Sign-in failed. Redirecting to login…';
      Utils.toast(err.message || 'Authentication failed', 'error');
      setTimeout(() => { window.location.href = '/login.html'; }, 2500);
    }
  }

  handleCallback();
</script>

</body>
</html>
