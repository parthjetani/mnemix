  <style>
    .callback-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      text-align: center;
      padding: var(--space-8);

      align-items: center;

<body>

<div class="callback-wrap" id="status">
  <div class="callback-logo">
    <div class="sidebar-logo-mark" style="width:32px;height:32px;font-size:14px;">M</div>
    <span class="sidebar-logo-text text-lg">MNEMIX</span>
  </div>
  <div class="spinner spinner-lg"></div>
  <p class="text-secondary" id="status-text">Signing you in…</p>
</div>

<div id="toast-container" class="toast-container"></div>

<script>
  async function handleCallback() {
    const statusEl = document.getElementById('status-text');

    try {
      const session = await Auth.handleCallback();

      if (!session) {
        statusEl.textContent = 'No session found. Redirecting to login…';
        setTimeout(() => { window.location.href = '/login.html'; }, 2000);
        return;
      }

      statusEl.textContent = 'Signed in! Redirecting…';

      // Check if user has completed onboarding (profile field set)
      try {
        const profile = await fetch('/api/v1/profile', {
          headers: { 'Authorization': `Bearer ${session.access_token}` }
        });
        const data = await profile.json();
        // last_updated is null for brand-new users (profile row not yet saved)
        if (profile.ok && data.last_updated) {
          window.location.href = '/dashboard.html';
        } else {
          window.location.href = '/onboarding.html';
        }
      } catch {
        // Can't check profile — send to onboarding as safe default
        window.location.href = '/onboarding.html';
      }

    } catch (err) {
      statusEl.textContent = 'Sign-in failed. Redirecting to login…';
      Utils.toast(err.message || 'Authentication failed', 'error');
      setTimeout(() => { window.location.href = '/login.html'; }, 2500);
    }
  }

  handleCallback();
</script>

</body>
</html>
