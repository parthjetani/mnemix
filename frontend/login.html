<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — MNEMIX</title>

  <!-- Supabase config — replace with your project values -->
  <meta name="supabase-url" content="https://fodnuozowtdesptqbray.supabase.co">
  <meta name="supabase-anon-key" content="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvZG51b3pvd3RkZXNwdHFicmF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDIxMzgsImV4cCI6MjA5NDY3ODEzOH0.O1YmQOEqWre1wAjYh3UKa1ANTmsOWAMl98JAsB129u4">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">

  <!-- CDN scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- App scripts -->
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>

  <style>
    .login-bg {
      background-image:
        radial-gradient(circle at 20% 50%, rgba(99,102,241,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(129,140,248,0.04) 0%, transparent 40%);
    }
    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-10) var(--space-8);
    }
    .sent-icon {
      width: 48px;
      height: 48px;
      background: rgba(16,185,129,0.12);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-4);
      color: var(--color-success);
    }
  </style>
</head>
<body class="login-bg">

<div class="auth-page" x-data="loginPage()">

  <!-- Default: sign-in form -->
  <div class="auth-card login-card" x-show="!sent">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="sidebar-logo-mark" style="width:36px;height:36px;font-size:16px;">M</div>
      <span class="sidebar-logo-text text-xl">MNEMIX</span>
    </div>

    <h1 class="text-xl font-semibold text-center mb-2">Sign in to MNEMIX</h1>
    <p class="text-sm text-secondary text-center mb-8">No password needed. We'll email you a sign-in link.</p>

    <!-- Email form -->
    <form @submit.prevent="sendLink">
      <div class="input-group mb-4">
        <label class="input-label" for="email">Email address</label>
        <input
          id="email"
          type="email"
          class="input"
          placeholder="you@example.com"
          x-model="email"
          :disabled="loading"
          autocomplete="email"
          required
          autofocus
        >
      </div>

      <button
        type="submit"
        class="btn btn-primary w-full btn-lg"
        :disabled="loading || !email.trim()"
      >
        <span x-show="loading" class="spinner" style="width:16px;height:16px;border-width:2px;"></span>
        <span x-text="loading ? 'Sending…' : 'Send magic link →'"></span>
      </button>
    </form>

    <div class="divider-text mt-6 mb-6">or</div>

    <!-- Dev bypass — localhost only -->
    <button class="btn btn-secondary w-full" @click="Auth.devLogin()" style="border-style:dashed;">
      <i data-lucide="terminal" style="width:15px;height:15px;"></i>
      Continue as dev (localhost only)
    </button>

    <!-- Google OAuth (future) -->
    <button class="btn btn-ghost w-full mt-2" @click="googleLogin" disabled style="opacity:0.35;cursor:not-allowed;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
      <span class="badge badge-neutral ml-auto">Soon</span>
    </button>

    <p class="text-xs text-tertiary text-center mt-6">
      By signing in you agree to our
      <a href="#" class="text-brand">Terms</a> and <a href="#" class="text-brand">Privacy Policy</a>.
    </p>
  </div>

  <!-- Sent: check inbox state -->
  <div class="auth-card login-card" x-show="sent" x-cloak>
    <div class="sent-icon">
      <i data-lucide="mail-check" style="width:24px;height:24px;"></i>
    </div>
    <h1 class="text-xl font-semibold text-center mb-2">Check your inbox</h1>
    <p class="text-sm text-secondary text-center mb-2">
      We sent a magic link to
    </p>
    <p class="text-sm font-medium text-center font-mono mb-6" x-text="email"></p>
    <p class="text-xs text-tertiary text-center mb-8">
      Click the link in the email to sign in. It expires in 10 minutes.
    </p>
    <button class="btn btn-ghost w-full" @click="sent = false">
      ← Use a different email
    </button>
  </div>

</div>

<!-- Toast container -->
<div id="toast-container" class="toast-container"></div>

<script>
  function loginPage() {
    return {
      email: '',
      loading: false,
      sent: false,

      async sendLink() {
        if (!this.email.trim()) return;
        this.loading = true;
        try {
          await Auth.sendMagicLink(this.email.trim());
          this.sent = true;
        } catch (err) {
          Utils.toast(err.message || 'Failed to send magic link. Try again.', 'error');
        } finally {
          this.loading = false;
        }
      },

      googleLogin() {
        // Placeholder — OAuth to be added in v0.2
      }
    };
  }

  // If already logged in, skip to dashboard
  (async () => {
    const session = await Auth.getSession();
    if (session) window.location.href = '/dashboard.html';
  })();
</script>

<script>
  document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
</script>

</body>
</html>
